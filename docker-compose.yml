# Adam Technical Services — production stack for a Digital Ocean droplet.
# Runs the Next.js + Payload app and PostgreSQL, with named volumes for the
# database and uploaded media. Put a reverse proxy (Nginx + Let's Encrypt) in
# front of the app for adam.qa — see docs/CMS.md.
#
# Usage:
#   cp .env.docker.example .env      # fill in the secrets
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-adam_cms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adam} -d ${POSTGRES_DB:-adam_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-adam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adam_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.adam.qa}
      PAYLOAD_MEDIA_DIR: /app/media
      # Optional email (password reset / form delivery):
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-info@adam.qa}
    volumes:
      - media:/app/media
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
