# Nginx reverse proxy for adamtest.webbea.qa -> Docker app on 127.0.0.1:3090
# 1. Place this file in: /etc/nginx/sites-available/adamtest.webbea.qa
# 2. Symlink: sudo ln -sf /etc/nginx/sites-available/adamtest.webbea.qa /etc/nginx/sites-enabled/
# 3. Test & reload: sudo nginx -t && sudo systemctl reload nginx
# 4. Issue SSL cert: sudo certbot --nginx -d adamtest.webbea.qa

server {
    listen 80;
    listen [::]:80;
    server_name adamtest.webbea.qa;

    # Prevent web server banner / version disclosure
    server_tokens off;

    # Allow large media and video uploads through the proxy to Payload CMS
    client_max_body_size 60m;

    # Block access to hidden files and directories (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
